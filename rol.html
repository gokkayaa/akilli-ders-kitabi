<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rol Yapalım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Rol yapma denemesi, three steps:
   1. Dinle   – the class listens to the dialogue from the book; the line being spoken lights up.
   2. Roller  – every character gets a student (picked from the class list, or left blank).
   3. Konuş   – the lines come up one by one on the board; the student whose line it is reads it
                and is recorded; → goes to the next line. At the end the class hears itself. */
:root{--brand:#00adb9;--brand-deep:#00838c;--ink:#22262a;--muted:#6b737a;--paper:#fff;--bg:#eaf6f7;--rec:#e0457b;
  --f:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
[hidden]{display:none!important}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.top .t{font-weight:800;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:6px}
.steps button{font-weight:800;font-size:16px;padding:6px 14px;border-radius:99px;background:#eef2f4;color:var(--muted)}
.steps button.on{background:var(--brand);color:#fff}
main{position:fixed;inset:60px 0 0 0;overflow:auto;-webkit-overflow-scrolling:touch}
/* chat bubbles */
.list{max-width:920px;margin:0 auto;padding:22px 16px 45vh}
.ln{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px;transition:opacity .25s}
.ln.R{flex-direction:row-reverse}
.ln img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.15);background:#fff}
.bub{position:relative;background:var(--paper);border-radius:22px;padding:10px 18px;font-size:min(4.4vw,30px);font-weight:700;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.07);max-width:74%;border:3px solid transparent}
.bub .who{display:block;font-size:.55em;font-weight:800;color:var(--muted);margin-bottom:2px}
.ln.dim{opacity:.4}
.ln.cur .bub{border-color:var(--brand);box-shadow:0 0 0 7px rgba(0,173,185,.18)}
.ln .acts{display:flex;gap:6px;align-self:center}
.ln .acts button{width:42px;height:42px;border-radius:50%;background:var(--rec);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);display:grid;place-items:center;font-size:17px}
/* step 3: the line being read is big */
#s3 .ln.cur .bub{font-size:min(6.4vw,50px);border-color:var(--rec);box-shadow:0 0 0 9px rgba(224,69,123,.16)}
#s3 .ln.cur img{width:84px;height:84px}
#s3 .ln.next{display:none}
.title{text-align:center;font-weight:800;font-size:24px;color:var(--brand-deep);margin:0 0 16px}
/* bottom bar */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.big{background:var(--brand);color:#fff;font-weight:800;font-size:26px;padding:10px 30px;border-radius:18px;box-shadow:0 6px 0 var(--brand-deep)}
.big.rec{background:var(--rec);box-shadow:0 6px 0 #a82a58}
.sm{background:#eef2f4;font-weight:800;font-size:18px;padding:10px 16px;border-radius:14px}
.lvl{width:58px;height:58px;border-radius:50%;background:var(--rec);display:grid;place-items:center;color:#fff;transition:box-shadow .08s}
.lvl svg{width:28px;height:28px}
.lvl.off{background:#c7cdd1}
.who-now{font-size:min(4.6vw,30px);font-weight:800}
.who-now b{color:var(--rec)}
.prog{font-weight:800;color:var(--muted);font-size:18px}
/* step 2: roles */
#s2 .wrap{max-width:900px;margin:0 auto;padding:30px 16px 140px;text-align:center}
#s2 h2{margin:0 0 6px;font-size:min(6vw,44px)}
#s2 p{margin:0 0 22px;color:var(--muted);font-weight:700;font-size:19px}
.roles{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.role{background:var(--paper);border-radius:26px;padding:18px 22px;width:min(320px,90vw);box-shadow:0 8px 0 rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.08)}
.role img{width:150px;height:150px;border-radius:50%;object-fit:cover}
.role b{display:block;font-size:34px;line-height:1.1;margin:6px 0 10px}
.role .stu{display:flex;gap:8px;align-items:center}
.role input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;border:2px solid #cfd8dd;border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink)}
.role input:focus{border-color:var(--brand);outline:none}
.role .dice{width:46px;height:46px;border-radius:12px;background:#e6f7f8;font-size:22px}
.note{margin-top:18px;color:var(--muted);font-weight:600}
/* end */
#end{position:fixed;inset:0;z-index:8;background:rgba(10,20,25,.55);display:grid;place-items:center;padding:16px}
.ecard{background:var(--paper);border-radius:28px;padding:26px 30px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.35);max-width:640px}
.ecard h2{margin:0 0 4px;font-size:min(9vw,56px);color:var(--brand-deep)}
.ecard p{margin:0 0 18px;font-weight:700;color:var(--muted);font-size:20px}
.ecard .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:9;background:var(--ink);color:#fff;font-weight:700;padding:8px 18px;border-radius:99px}
@media (max-width:640px){.bub{max-width:82%}.ln img{width:42px;height:42px}}
</style>
</head>
<body>
<div class="top">
  <span class="t" id="dTitle"></span>
  <div class="steps"><button data-s="1" class="on">1. Dinle</button><button data-s="2">2. Roller</button><button data-s="3">3. Konuş</button></div>
</div>

<!-- 1. Dinle -->
<main id="s1"><div class="list" id="l1"></div></main>
<div class="bbar" id="b1">
  <button class="big" id="playB">▶ Dinle</button>
  <button class="sm" id="toS2">Rolleri dağıt →</button>
</div>

<!-- 2. Roller -->
<main id="s2" hidden><div class="wrap">
  <h2>Kim konuşacak?</h2>
  <p>Her karaktere bir öğrenci seç.</p>
  <div class="roles" id="roles"></div>
  <div class="note" id="rosterNote"></div>
</div></main>
<div class="bbar" id="b2" hidden>
  <button class="sm" id="dealB">🎲 Rastgele dağıt</button>
  <button class="big" id="toS3">Başla →</button>
</div>

<!-- 3. Konuş -->
<main id="s3" hidden><div class="list" id="l3"></div></main>
<div class="bbar" id="b3" hidden>
  <span class="lvl" id="lvl"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
  <span class="who-now" id="whoNow"></span>
  <span class="prog" id="prog"></span>
  <button class="sm" id="redoB">↺ Tekrar</button>
  <button class="big rec" id="nextB">Sonraki →</button>
</div>

<div id="end" hidden><div class="ecard">
  <h2>Aferin!</h2>
  <p>Diyaloğu birlikte okudunuz.</p>
  <div class="row">
    <button class="big" id="mixB">▶ Kaydı dinle</button>
    <button class="sm" id="origB">Kitaptaki ses</button>
    <button class="sm" id="againB">Yeniden oyna</button>
    <button class="sm" id="closeB">Kapat</button>
  </div>
</div></div>
<div id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
/* one dialogue from the book; times (s) in its recording, found from the pauses and the line lengths */
const D = {
  title: 'Maviş ve Meraklı Boncuk Okulda', where: 'Ders Kitabı 1 s.50', audio: 'audio/dk/S035.mp3',
  who: {M:{name:'Maviş', img:'assets/rol/mavis.jpg', side:'R', bg:'#e3f1fc'}, B:{name:'Boncuk', img:'assets/rol/boncuk.jpg', side:'L', bg:'#fff4d6'}},
  lines: [
   ['M','Boncuk bak, burası sınıf.',6.05,7.88], ['B','Peki bunlar kim?',8.33,9.79],
   ['M','Bunlar öğrenciler. Bu da öğretmen.',10.70,14.77], ['B','Sınıf kaçıncı katta?',15.22,17.66],
   ['M','Sınıf ikinci katta.',18.56,20.57], ['B','Peki şurası neresi?',21.36,24.77],
   ['M','Orası öğretmenler odası.',25.28,29.30], ['B','Onlar öğretmen mi?',29.94,31.06],
   ['M','Evet, onlar öğretmen.',31.48,34.19], ['B','Hmm! Burada yedi öğretmen var.',35.03,38.72],
   ['M','Evet, Boncuk.',39.25,40.25], ['B','Maviş, burası kaçıncı kat?',40.70,43.24],
   ['M','Burası birinci kat.',43.74,45.10], ['B','Birinci katta neler var?',45.73,47.93],
   ['M','Birinci katta kütüphane, laboratuvar ve tuvalet var.',48.74,54.32],
   ['B','Aa, kitaplara bak! Ne kadar çok kitap var!',54.89,59.34],
   ['M','Sessiz ol Boncuk! Burası kütüphane.',60.06,64.14], ['B','Burası laboratuvar mı?',64.78,68.64],
   ['M','Evet, burası laboratuvar.',69.31,73.33], ['B','Şurası yemekhane mi?',74.09,76.83],
   ['M','Hayır! Orası kantin.',77.51,80.04], ['B','O, kim? Bu ses ne?',80.47,81.80], ['M','Aa! Koş koş...',82.10,85.42]
  ].map(([sp, t, a, b]) => ({sp, t, a, b}))
};
const store = { get(k, d){ try{ const v = localStorage.getItem('adk:' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } } };
const CLS = store.get('cls', null), ROSTER = (store.get('roster', {})[CLS]) || [];
const cast = {};                  // sp → student name
const rec = [];                   // line index → blob url
let step = 1, cur = -1, stream = null, mr = null, chunks = [], ac = null;
const orig = new Audio(D.audio); orig.preload = 'auto';
const player = new Audio();
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
$('#dTitle').textContent = `${D.title} · ${D.where}`;

function bubble(l, i, extra){
  const w = D.who[l.sp], nm = cast[l.sp];
  const d = document.createElement('div'); d.className = `ln ${w.side}` + (extra || ''); d.dataset.i = i;
  d.innerHTML = `<img src="${w.img}" alt=""><div class="bub" style="background:${w.bg}"><span class="who">${w.name}${nm && step === 3 ? ' · ' + nm : ''}</span>${l.t}</div><div class="acts"></div>`;
  return d;
}
function mark(list, i){
  list.querySelectorAll('.ln').forEach(d => { const k = +d.dataset.i; d.classList.toggle('cur', k === i); });
  const el = list.querySelector(`.ln[data-i="${i}"]`); if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
}
function stopAll(){ orig.pause(); player.pause(); $('#playB').textContent = '▶ Dinle'; mixing = false; }

/* ---------- 1. Dinle: the whole recording plays once, the spoken line lights up ---------- */
function drawS1(){ const L = $('#l1'); L.innerHTML = `<div class="title">${D.title}</div>`; D.lines.forEach((l, i) => L.appendChild(bubble(l, i))); }
let raf = 0;
function follow(){
  const t = orig.currentTime, i = D.lines.findIndex(l => t >= l.a - .15 && t <= l.b + .3);
  if(i >= 0 && i !== follow.last){ follow.last = i; mark($('#l1'), i); }
  if(!orig.paused) raf = requestAnimationFrame(follow);
}
$('#playB').addEventListener('click', () => {
  if(orig.paused){ player.pause(); if(orig.ended) orig.currentTime = 0; orig.play().catch(() => toast('Ses açılamadı')); $('#playB').textContent = '⏸ Durdur'; follow.last = -1; raf = requestAnimationFrame(follow); }
  else { orig.pause(); $('#playB').textContent = '▶ Devam'; }
});
orig.addEventListener('ended', () => { $('#playB').textContent = '↺ Yeniden dinle'; mark($('#l1'), -1); });

/* ---------- 2. Roller ---------- */
function drawS2(){
  const R = $('#roles'); R.innerHTML = '';
  for(const sp in D.who){ const w = D.who[sp], c = document.createElement('div'); c.className = 'role';
    c.innerHTML = `<img src="${w.img}" alt=""><b>${w.name}</b><div class="stu"><input placeholder="Öğrencinin adı" value="${cast[sp] || ''}" list="stuList"><button class="dice" title="Rastgele">🎲</button></div>`;
    const inp = c.querySelector('input'); inp.addEventListener('input', () => cast[sp] = inp.value.trim());
    c.querySelector('.dice').addEventListener('click', () => { const n = pickOne(sp); if(n){ cast[sp] = n; inp.value = n; } });
    R.appendChild(c); }
  let dl = document.getElementById('stuList'); if(!dl){ dl = document.createElement('datalist'); dl.id = 'stuList'; document.body.appendChild(dl); }
  dl.innerHTML = ROSTER.map(n => `<option value="${n}">`).join('');
  $('#rosterNote').textContent = ROSTER.length ? `${CLS} listesinden seçebilir ya da adı yazabilirsin. Boş da kalabilir.` : 'Ad yazmak zorunlu değil; boş bırakıp başlayabilirsin.';
  $('#dealB').hidden = !ROSTER.length;
}
function pickOne(sp){
  if(!ROSTER.length){ toast('Bu sınıfın listesi yok'); return null; }
  const used = new Set(Object.entries(cast).filter(([k]) => k !== sp).map(([, v]) => v));
  const free = ROSTER.filter(n => !used.has(n)); const pool = free.length ? free : ROSTER;
  return pool[Math.floor(Math.random() * pool.length)];
}
$('#dealB').addEventListener('click', () => { for(const sp in D.who) cast[sp] = null; for(const sp in D.who) cast[sp] = pickOne(sp); drawS2(); });

/* ---------- 3. Konuş: one line at a time, each line recorded on its own ---------- */
async function micOn(){
  if(stream) return true;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); meter(); return true; }
  catch(e){ toast('Mikrofon açılamadı; kayıtsız devam ediyoruz'); $('#lvl').classList.add('off'); return false; }
}
function meter(){
  try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an);
    const d = new Uint8Array(an.fftSize);
    (function loop(){ an.getByteTimeDomainData(d); let m = 0; for(const v of d) m = Math.max(m, Math.abs(v - 128));
      $('#lvl').style.boxShadow = `0 0 0 ${Math.round(m / 128 * 30)}px rgba(224,69,123,.3)`; requestAnimationFrame(loop); })();
  }catch(e){}
}
function startRec(i){
  if(!stream || !window.MediaRecorder) return;
  chunks = []; mr = new MediaRecorder(stream); const r = mr;
  r.ondataavailable = e => e.data.size && chunks.push(e.data);
  r.onstop = () => { if(chunks.length){ if(rec[i]) URL.revokeObjectURL(rec[i]); rec[i] = URL.createObjectURL(new Blob(chunks, {type: r.mimeType || 'audio/mp4'})); drawActs(); } };
  r.start();
}
function stopRec(){ if(mr && mr.state !== 'inactive') mr.stop(); }
function drawS3(){
  const L = $('#l3'); L.innerHTML = `<div class="title">${D.title}</div>`;
  D.lines.forEach((l, i) => L.appendChild(bubble(l, i, i > cur ? ' next' : '')));
  mark(L, cur); drawActs();
  const l = D.lines[cur];
  if(l){ const w = D.who[l.sp]; $('#whoNow').innerHTML = `<b>${cast[l.sp] || w.name}</b>${cast[l.sp] ? ' (' + w.name + ')' : ''} okuyor`; }
  $('#prog').textContent = `${Math.min(cur + 1, D.lines.length)} / ${D.lines.length}`;
}
function drawActs(){
  if(step !== 3) return;
  $('#l3').querySelectorAll('.ln').forEach(d => { const i = +d.dataset.i, a = d.querySelector('.acts'); a.innerHTML = '';
    if(rec[i] && i < cur){ const b = document.createElement('button'); b.textContent = '▶'; b.title = 'Dinle';
      b.onclick = () => { stopAll(); player.src = rec[i]; player.play(); }; a.appendChild(b); } });
}
async function begin(){
  stopAll(); rec.length = 0; cur = 0; await micOn(); show(3); drawS3(); startRec(0);
}
function next(){
  if(step !== 3 || cur >= D.lines.length) return;
  stopRec(); cur++;
  if(cur >= D.lines.length){ drawS3(); setTimeout(() => $('#end').hidden = false, 400); return; }
  drawS3(); startRec(cur);
}
function redo(){ if(cur >= D.lines.length) return; if(mr && mr.state !== 'inactive'){ mr.onstop = null; mr.stop(); } startRec(cur); toast('Bu satırı yeniden oku'); }

/* the whole dialogue in the class's own voices */
let mixing = false;
function mix(i){
  if(i === 0){ stopAll(); mixing = true; $('#end').hidden = true; cur = D.lines.length; drawS3(); }
  if(!mixing) return;
  if(i >= D.lines.length){ mixing = false; mark($('#l3'), -1); $('#end').hidden = false; return; }
  mark($('#l3'), i);
  if(!rec[i]){ setTimeout(() => mix(i + 1), 600); return; }
  player.src = rec[i]; player.onended = () => setTimeout(() => mix(i + 1), 200); player.play().catch(() => mix(i + 1));
}

function show(s){
  step = s; stopAll(); stopRec();
  ['1','2','3'].forEach(k => { $('#s' + k).hidden = k != s; $('#b' + k).hidden = k != s; });
  document.querySelectorAll('.steps button').forEach(b => b.classList.toggle('on', b.dataset.s == s));
  if(s === 1) drawS1(); if(s === 2) drawS2();
}
document.querySelectorAll('.steps button').forEach(b => b.addEventListener('click', () => { const s = +b.dataset.s; if(s === 3) begin(); else show(s); }));
$('#toS2').addEventListener('click', () => show(2));
$('#toS3').addEventListener('click', begin);
$('#nextB').addEventListener('click', next);
$('#redoB').addEventListener('click', redo);
$('#mixB').addEventListener('click', () => mix(0));
$('#origB').addEventListener('click', () => { $('#end').hidden = true; show(1); $('#playB').click(); });
$('#againB').addEventListener('click', () => { $('#end').hidden = true; show(2); });
$('#closeB').addEventListener('click', () => $('#end').hidden = true);
addEventListener('keydown', e => {
  if(!$('#end').hidden) return;
  if(step === 3 && ['ArrowRight','PageDown','Enter',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(step === 1 && [' ','Enter'].includes(e.key)){ e.preventDefault(); $('#playB').click(); }
});
show(1);
})();
</script>
</body>
</html>
