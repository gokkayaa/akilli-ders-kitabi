<title>Akıllı Ders Kitabı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Kalam:wght@700&display=swap">
<style>
/* Layout: the open book fills the screen; arrows step through it like slides (spread → zoom into an activity → answers one by one → back to the spread). A slim rail in the leftover margin holds tools and the audio player, so nothing sits on the book. Single deliberate look. */
:root{
  --surround:#23272b; --rail:#31363b; --rail-hi:#3d4349; --rail-ink:#e9edf0;
  --paper:#ffffff; --text:#22262a; --muted:#6b737a;
  --brand:#00adb9; --brand-deep:#00838c;
  --ink-red:#d0202a; --ink-blue:#1d5fc0;
  --dim:rgba(14,16,18,.86);
  --f-ui:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-hand:"Kalam", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--surround);color:var(--rail-ink);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

#spread{position:fixed;display:flex;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.page{position:relative;background:var(--paper);overflow:hidden;--ph:800px}
.page>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#spread.two .page.left::after{content:"";position:absolute;inset:0 0 0 auto;width:4%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.10));pointer-events:none}
#spread.two .page.right::before{content:"";position:absolute;inset:0 auto 0 0;width:4%;background:linear-gradient(270deg,transparent,rgba(0,0,0,.10));pointer-events:none;z-index:1}

/* step arrows */
.nav{position:fixed;top:50%;width:46px;height:130px;margin-top:-65px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;z-index:40}
.nav svg{width:30px;height:30px}
.nav[disabled]{opacity:.15;pointer-events:none}

/* overlay pieces, in % of the page */
.act{position:absolute;pointer-events:none}
.ans{position:absolute;display:block;white-space:nowrap;font-family:var(--f-hand);font-weight:700;color:var(--ink-red);line-height:1;
  opacity:0;transition:opacity .3s ease;pointer-events:none}
.ans .bl{display:inline-block;width:0;height:0;vertical-align:baseline}
.ans.on{opacity:1}
.zoom .ans.on{pointer-events:auto;cursor:pointer}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.lines path{fill:none;stroke:var(--ink-blue);stroke-width:.55;stroke-linecap:round;stroke-dasharray:100 102;stroke-dashoffset:101;transition:stroke-dashoffset .6s ease-out}
svg.lines path.on{stroke-dashoffset:0}
.dot{position:absolute;width:calc(var(--ph)*.036);height:calc(var(--ph)*.036);margin:calc(var(--ph)*-.018) 0 0 calc(var(--ph)*-.018);border-radius:50%;display:none;place-items:center;z-index:3}
.dot::before{content:"";width:calc(var(--ph)*.012);height:calc(var(--ph)*.012);min-width:9px;min-height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.35)}
.zoom .dot{display:grid}
.zoom .dot.on{display:none}
.zoom .dot.keep.on{display:grid}
.zoom .dot.keep.on::before{background:#fff;box-shadow:0 0 0 2px var(--brand)}
.aud{position:absolute;z-index:3;border-radius:99px}
.aud::after{content:"";position:absolute;inset:-18% -8%;border-radius:99px;border:2px solid var(--brand);opacity:0;animation:ring 2.6s infinite}
.aud.playing::after{border-color:var(--ink-red);opacity:1;animation:none}
@keyframes ring{0%{opacity:.85}70%{opacity:0}100%{opacity:0}}
.link{position:absolute;z-index:3;border-radius:6px}
.link:active{background:rgba(0,173,185,.18)}
.link.hint{animation:hint 1.6s ease-out 2}
@keyframes hint{0%{box-shadow:0 0 0 0 rgba(0,173,185,.55)}100%{box-shadow:0 0 0 14px rgba(0,173,185,0)}}
svg.lines .rv{opacity:0;transition:opacity .3s ease}
svg.lines .rv.on{opacity:1}
svg.lines .mk{fill:none;stroke:var(--ink-red);stroke-width:.5;stroke-linecap:round;stroke-linejoin:round}
svg.lines .fl{fill:rgba(255,206,0,.42);stroke:none;mix-blend-mode:multiply}
svg.lines path.ul{stroke:var(--ink-red);stroke-width:.45}
.ans.box{display:flex;align-items:center;justify-content:center}
.ans.box.l{justify-content:flex-start}
.aud.miss::after{border-style:dashed;border-color:#9aa3aa}
canvas.ink{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;touch-action:none}
.inking canvas.ink{pointer-events:auto;cursor:crosshair}

#back{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:6px;background:var(--rail);color:var(--rail-ink);
  font-weight:700;font-size:15px;padding:4px 14px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.35);opacity:.92}
#back svg{width:18px;height:18px}

/* ---------- zoom (focus) ---------- */
#zoom{position:fixed;inset:0;z-index:30;background:var(--dim);opacity:0;transition:opacity .35s ease}
#zoom.in{opacity:1}
#board{position:absolute;transform-origin:0 0;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.tile{position:absolute;overflow:hidden;background:var(--paper);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.tile .page{position:absolute}
.tile.num{overflow:visible}
.tile.num>.clip{position:absolute;inset:0;overflow:hidden;border-radius:6px}
.tno{position:absolute;z-index:8;left:-14px;top:-14px;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.35)}
#bbar{position:fixed;left:16px;right:16px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:41;display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap-reverse;pointer-events:none}
#bbar>*{pointer-events:auto}
#zbar{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:17px;background:var(--rail);border-radius:99px;padding:4px 6px 4px 16px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#zbar .cnt{font-variant-numeric:tabular-nums;color:#aeb6bd;font-size:15px}
#zbar button{display:flex;align-items:center;gap:6px;background:var(--rail-hi);border-radius:99px;padding:4px 12px}
#zbar button svg{width:20px;height:20px}
#zbar #zEye[aria-pressed="true"]{background:var(--ink-red)}

/* ---------- rail ---------- */
#rail{position:fixed;z-index:42;display:flex;gap:4px;padding:6px;border-radius:16px;background:var(--rail);box-shadow:0 6px 20px rgba(0,0,0,.4);align-items:center}
#rail.v{right:8px;top:50%;transform:translateY(-50%);flex-direction:column}
#rail.h{bottom:calc(6px + env(safe-area-inset-bottom,0px));right:8px;flex-direction:row}
.tool{position:relative;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--rail-ink)}
.tool svg{width:26px;height:26px}
.tool[aria-pressed="true"]{background:var(--paper);color:var(--text)}
.tool .cdot{position:absolute;right:6px;bottom:6px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--rail)}
.tool.txt{font-weight:800;font-size:15px}
.sep{background:var(--rail-hi);border-radius:2px;flex:none}
#rail.v .sep{height:2px;width:34px;margin:3px 0}
#rail.h .sep{width:2px;height:34px;margin:0 3px}
#pens{position:fixed;z-index:43;display:flex;gap:8px;padding:8px;border-radius:14px;background:var(--rail);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px #fff}
/* audio lives inside the rail */
#audio{display:flex;gap:4px;align-items:center;
  background:var(--rail);border-radius:16px;padding:4px 8px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#audio .code{font-weight:800;color:#fff;background:var(--brand);border-radius:8px;padding:1px 6px;font-size:13px;white-space:nowrap}
#audio .t{font-variant-numeric:tabular-nums;font-size:12px;color:#aeb6bd;min-width:40px;text-align:center}
#audio .pb{background:var(--brand);border-radius:50%}
#audio .tool.slow{font-weight:800;font-size:14px}

/* ---------- timer ---------- */
#timer{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:45;background:var(--rail);color:#fff;border-radius:16px;padding:8px 12px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:180px}
#timer .big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#timer.low .big{color:#ff5a5f}
#timer.done{animation:shake .5s 3}
@keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
#timer .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#timer .row button{background:var(--rail-hi);border-radius:10px;padding:2px 10px;font-weight:700;font-size:15px}
#timer .row button.go{background:var(--brand)}
#timer .x{position:absolute;top:2px;right:8px;font-size:20px;color:#aab2b9}

/* ---------- class picker ---------- */
#picker{position:fixed;inset:0;z-index:60;background:var(--dim);display:grid;place-items:center;padding:16px}
.card{background:var(--paper);color:var(--text);border-radius:20px;padding:22px 22px 20px;max-width:480px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.5);text-align:center}
.card h2{margin:0 0 4px;font-size:26px}
.card p{margin:0 0 14px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.grid button{background:#e6f7f8;border:2px solid var(--brand);border-radius:14px;padding:10px 6px 6px}
.grid button b{display:block;font-size:30px;line-height:1;color:var(--brand-deep)}
.grid button small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(50px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--rail);color:#fff;font-weight:700;padding:6px 16px;border-radius:99px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
/* İzo: where are we */
.tool.izo img{width:34px;height:34px;object-fit:contain}
#where{position:fixed;inset:0;z-index:65;background:var(--dim);display:grid;place-items:center;padding:16px;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.wcard{display:flex;align-items:flex-end;gap:2vw;background:var(--paper);color:var(--text);border-radius:28px;padding:3vh 4vw 3vh 2vw;box-shadow:0 30px 60px rgba(0,0,0,.5);max-width:94vw}
.wizo{height:min(52vh,420px);width:auto;animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.wtx{display:flex;flex-direction:column;gap:1.2vh;min-width:0}
.wtx p{margin:0;line-height:1.05}
.whi{font-size:min(6vw,64px);font-weight:800}
.whi b{color:var(--brand-deep)}
.wgo{font-size:min(3.4vw,36px);font-weight:700;color:var(--muted);margin-bottom:1vh!important}
.wrow{display:flex;align-items:center;gap:1.4vw;flex-wrap:wrap}
.wbk{font-size:min(2.8vw,30px);font-weight:800;color:#fff;border-radius:14px;padding:.2em .7em}
.wbk.dk{background:#f07d1a}.wbk.dbt{background:#3a9a8f}
.wpg{font-size:min(9vw,104px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.wpg small{font-size:.45em;color:var(--muted);margin-right:.15em}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="loading">Kitap açılıyor…</div>
<div id="spread"></div>
<div id="zoom" hidden><div id="board"></div></div>
<button class="nav" id="prev" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav" id="next" aria-label="İleri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<button id="back" hidden></button>

<nav id="rail" class="v" aria-label="Araçlar">
  <button class="tool txt" id="clsBtn" title="Sınıf">7A</button>

  <div class="sep"></div>
  <button class="tool" data-tool="pen" aria-pressed="false" title="Kalem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg><span class="cdot" id="penDot" style="background:#d0202a"></span></button>
  <button class="tool" data-tool="hl" aria-pressed="false" title="Fosforlu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 15l-3 3v2h4l3-3"/><path d="M9 15l7.5-9.5a2 2 0 013 0l1 1a2 2 0 010 3L13 17z"/><path d="M3 22h8" stroke-width="3" stroke="#ffd400"/></svg></button>
  <button class="tool" id="undo" title="Geri al"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="tool" id="wipe" title="Çizimleri temizle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 21h13"/><path d="M5.5 15.5l9-9 5 5-6.5 6.5H9z"/><path d="M10 11l5 5"/></svg></button>
  <div class="sep"></div>
  <button class="tool" id="timerBtn" title="Süre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12M6 21h12"/><path d="M7 3c0 5 10 5 10 9s-10 4-10 9"/><path d="M17 3c0 5-10 5-10 9s10 4 10 9"/></svg></button>
  <button class="tool" id="fsBtn" title="Tam ekran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>
<div id="bbar"><div id="zbar" hidden><span id="zLabel"></span><span class="cnt" id="zCount"></span>
  <button id="zEye" aria-pressed="false"></button>
  <button id="zClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Sayfaya dön</button></div><div id="audio" hidden>
    <span class="code" id="pCode">S.000</span>
    <button class="tool pb" id="pPlay" aria-label="Çal / durdur"></button>
    <span class="t" id="pTime">0:00</span>
    <button class="tool" id="pAgain" title="Baştan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="tool slow" id="pSlow" aria-pressed="false" title="Yavaş">0.8×</button>
    <button class="tool" id="pClose" title="Sesi kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div></div>
<div id="pens" hidden>
  <button class="sw" style="background:#d0202a" data-c="#d0202a" aria-label="Kırmızı" aria-pressed="true"></button>
  <button class="sw" style="background:#1d5fc0" data-c="#1d5fc0" aria-label="Mavi" aria-pressed="false"></button>
  <button class="sw" style="background:#1f7a3a" data-c="#1f7a3a" aria-label="Yeşil" aria-pressed="false"></button>
  <button class="sw" style="background:#22262a" data-c="#22262a" aria-label="Siyah" aria-pressed="false"></button>
</div>

<div id="timer" hidden>
  <button class="x" id="tClose" aria-label="Sayacı kapat">×</button>

  <div class="card">

</div>

  <div class="wcard">

      <p class="whi">Merhaba <b id="wCls">7A</b>!</p>
      <p class="wgo">Haydi, kitabını aç!</p>

<script>
(() => {
const CLASSES = ['7A','7B','7C','7D'];
const START = {book:'dk', page:16};
const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const LINE_COLORS = ['#1d5fc0', '#d0202a', '#1f8a3a', '#8e3fb0', '#e07a00', '#00838c', '#c2185b', '#5d4037'];
const ICON = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><path d="M4 4l16 16"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>'
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('adk:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('adk:'+k, JSON.stringify(v)); }catch(e){} }
};
/* cursor = index into spreadSteps() of the last step taken on this spread (-1 = none) */
const S = { books:{}, book:'dk', page:16, cls:null, revealed:new Set(), tool:null, color:'#d0202a', ink:{}, back:[], two:true, cursor:-1, zoom:null };
let pos = store.get('pos', {});

const pagesOf = b => Object.keys(S.books[b].pages).map(Number).sort((a,b)=>a-b);
const bookName = b => b === 'dk' ? 'Ders kitabı' : 'Telaffuz';
function viewPages(){
  const list = pagesOf(S.book), p = S.page;
  if(!S.two) return [p];
  const left = p % 2 === 0 ? p : p - 1;
  return [left, left + 1].filter(n => list.includes(n));
}
/* answer groups of an activity, in order: items sharing "g" open together */
function groupsOf(A){
  const gs = [], idx = {};
  A.items.forEach(it => { const g = A.id + ':' + (it.g || it.id); if(!(g in idx)){ idx[g] = gs.length; gs.push({id:g, items:[]}); } gs[idx[g]].items.push(it); });
  return gs;
}
/* steps on the visible spread: activities and in-book cross references, in reading order */
function spreadOf(book, page){
  const list = pagesOf(book);
  if(!S.two) return [page];
  const left = page % 2 === 0 ? page : page - 1;
  return [left, left + 1].filter(n => list.includes(n));
}
function spreadSteps(book = S.book, pages = viewPages()){
  const out = [];
  pages.forEach(n => {
    const P = S.books[book].pages[n], here = [];
    P.activities.filter(A => !A.skip).forEach(A => here.push({kind:'act', A, book, n, y:A.rect[1], x:A.rect[0]}));
    (P.links || []).forEach(L => here.push({kind:'link', L, book, n, y:L.rect[1], x:L.rect[0]}));
    here.sort((a, b) => Math.abs(a.y - b.y) < 3 ? a.x - b.x : a.y - b.y);
    out.push(...here);
  });

/* ---------- one page with its overlay ---------- */
function buildPage(book, n, inZoom){
  const B = S.books[book], P = B.pages[n];
  const el = document.createElement('div');
  el.className = 'page'; el.dataset.key = book + ':' + n;
  el.innerHTML = `<img src="${P.img}" alt="${bookName(book)} sayfa ${n}" draggable="false">`;
  const ky = 1 / B.aspect, U = y => y * ky;
  const svg = document.createElementNS(SVGNS,'svg');
  svg.setAttribute('class','lines'); svg.setAttribute('viewBox',`0 0 100 ${(100*ky).toFixed(3)}`); svg.setAttribute('preserveAspectRatio','none');
  el.appendChild(svg);
  const mk = (tag, attrs, g, cls) => { const e = document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); e.dataset.g = g; if(cls) e.setAttribute('class', cls); svg.appendChild(e); return e; };
  for(const A of P.activities){
    const lineGroups = groupsOf(A).filter(G => G.items.some(i => i.type === 'line')).map(G => G.id);
    for(const G of groupsOf(A)){
      let dotAt = null, keep = false;
      const col = lineGroups.length > 1 ? LINE_COLORS[lineGroups.indexOf(G.id) % LINE_COLORS.length] : null;
      for(const it of G.items){
        const g = G.id;
        if(it.type === 'blank'){
          const [x0,x1,ly] = it.line, hh = it.h || 1.75;
          const s = ansSpan(it.text, g, inZoom);
          s.dataset.h = hh; s.dataset.ly = ly; s.dataset.a = A.id; s.dataset.x0 = x0; s.dataset.x1 = x1;
          Object.assign(s.style,{left:(x0 + .5)+'%', width:(x1 - x0 - .3)+'%', top:(ly - hh)+'%'});
          el.appendChild(s);
          dotAt = dotAt || [x0 + .9, ly];
        } else if(it.type === 'text'){
          const [x,y,w,h] = it.rect;
          const s = ansSpan(it.text, g, inZoom); s.classList.add('box'); if(it.align === 'l') s.classList.add('l');
          s.dataset.box = h;

          el.appendChild(s);
          dotAt = dotAt || (it.align === 'l' ? [x + .9, y + h/2] : [x + w/2, y + h/2]);
        } else if(it.type === 'line' || it.type === 'uline'){
          const [x1,y1] = it.from, [x2,y2] = it.to;
          const d = it.type === 'line'
            ? `M${x1} ${U(y1).toFixed(2)} Q${((x1+x2)/2+.6).toFixed(2)} ${((U(y1)+U(y2))/2-1).toFixed(2)} ${x2} ${U(y2).toFixed(2)}`
            : `M${x1} ${U(y1).toFixed(2)} L${x2} ${U(y2).toFixed(2)}`;
          const pe = mk('path', {d, pathLength:100}, g, it.type === 'uline' ? 'ul' : '');
          if(it.type === 'line' && col) pe.style.stroke = col;
          if(it.type === 'line'){ keep = true; dotAt = dotAt || it.dot || it.from; }
          else dotAt = dotAt || it.dot || [x1 - .9, y1];
        } else if(it.type === 'check'){
          const [x,y] = it.at, s = (it.s || 2.4) * ky;
          mk('path', {d:`M${x - .45*s} ${U(y)} l${.35*s} ${.4*s} l${.75*s} ${-.85*s}`}, g, 'rv mk');
          dotAt = dotAt || it.dot || [x, y];
        } else if(it.type === 'ellipse'){
          const [x,y,w,h] = it.rect;

          const [x,y,w,h] = it.rect;

    }
    for(const a of (A.audio || [])){

      Object.assign(b.style,{left:ax+'%',top:ay+'%',width:aw+'%',height:ah+'%'});
      b.addEventListener('click', ev => { ev.stopPropagation(); openAudio(a); });

    }

  if(!inZoom) for(const L of (P.links || [])){
    const [lx,ly,lw,lh] = L.rect, b = document.createElement('button');
    b.className = 'link hint'; b.setAttribute('aria-label', L.label);
    Object.assign(b.style,{left:lx+'%',top:ly+'%',width:lw+'%',height:lh+'%'});
    b.addEventListener('click', ev => { ev.stopPropagation(); const st = spreadSteps(), k = st.findIndex(o => o.kind === 'link' && o.L === L); follow(L, k); });
    el.appendChild(b);
  }
  const cv = document.createElement('canvas'); cv.className = 'ink'; el.appendChild(cv);
  setupInk(cv, el.dataset.key);
  if(!inZoom) el.addEventListener('click', ev => onSpreadTap(ev, el, n));
  syncReveal(el);
  return el;
}
function ansSpan(text, g, inZoom){

/* boxes: sized to the box, centred.
   blanks: baseline on the dotted line; height limited by the blank line above it;
   one common size per activity (the median), shrunk further only where a blank is too narrow */
function fit(root){
  const blanks = [];
  root.querySelectorAll('.ans').forEach(s => {
    const pg = s.closest('.page'); if(!pg) return;
    const ph = parseFloat(pg.style.getPropertyValue('--ph')) || 800;
    if(s.dataset.box){
      const bh = parseFloat(s.dataset.box) / 100 * ph;
      let fs = bh * .8; s.style.fontSize = fs + 'px'; s.style.lineHeight = bh + 'px';
      const w = s.clientWidth; let k = 0;
      while(s.scrollWidth > w + 1 && k++ < 40){ fs *= .94; s.style.fontSize = fs + 'px'; }
      return;
    }
    blanks.push({s, pg, ph, a:s.dataset.a, x0:+s.dataset.x0, x1:+s.dataset.x1, ly:+s.dataset.ly, hh:+s.dataset.h});
  });
  for(const b of blanks){
    let cap = b.hh;
    for(const o of blanks){
      if(o === b || o.pg !== b.pg || o.ly >= b.ly - .2) continue;
      if(o.x1 < b.x0 || o.x0 > b.x1) continue;
      cap = Math.min(cap, (b.ly - o.ly) * .8);
    }
    b.fsH = Math.max(6, cap / 100 * b.ph * 1.2);
    b.s.style.fontSize = '100px';
    b.fsW = 100 * b.s.clientWidth / Math.max(1, b.s.scrollWidth) * .97;
    b.ideal = Math.min(b.fsH, b.fsW);
  }
  const byAct = {};
  blanks.forEach(b => (byAct[b.a + '|' + b.pg.dataset.key] = byAct[b.a + '|' + b.pg.dataset.key] || []).push(b));
  Object.values(byAct).forEach(list => {
    const med = Math.min(...list.map(b => b.fsH));
    list.forEach(b => {
      const fs = Math.min(med, b.fsH, b.fsW);
      b.s.style.fontSize = fs + 'px';
      const base = b.s.querySelector('.bl').offsetTop;
      b.s.style.top = ((b.ly / 100 * b.ph - b.ph * .0025 - base) / b.ph * 100) + '%';
    });
  });
}

/* ---------- steps: → and ← ---------- */
function next(){
  if(S.zoom){
    const nx = groupsOf(S.zoom.A).find(G => !S.revealed.has(G.id));
    if(nx){ S.revealed.add(nx.id); syncAll(); } else closeZoom();
    return;
  }
  if(returnDue()){ doReturn(); return; }
  const st = spreadSteps();
  if(S.cursor + 1 < st.length){
    S.cursor++; const o = st[S.cursor];
    if(o.kind === 'link') follow(o.L, S.cursor); else openZoom(o);
    return;
  }
  const list = pagesOf(S.book), vp = viewPages(), t = list.find(p => p > vp[vp.length-1]);
  if(t != null) go(S.book, t);
}
function prev(){
  if(S.zoom){
    const shown = groupsOf(S.zoom.A).filter(G => S.revealed.has(G.id));
    if(shown.length){ S.revealed.delete(shown[shown.length-1].id); syncAll(); }
    else { const k = S.cursor; closeZoom(); S.cursor = k - 1; updNav(); }
    return;
  }
  const st = spreadSteps();
  while(S.cursor >= 0 && st[S.cursor].kind === 'link') S.cursor--;
  if(S.cursor >= 0){ openZoom(st[S.cursor]); return; }
  const top = S.back[S.back.length - 1];
  if(top && top.until && viewPages().includes(top.to.page) && S.book === top.to.book){ doReturn(-1); return; }
  const list = pagesOf(S.book), vp = viewPages(), t = [...list].reverse().find(p => p < vp[0]);
  if(t != null){ go(S.book, t); S.cursor = spreadSteps().length - 1; updNav(); }
}
/* a cross reference: go to the other book, come back when its section is done */
function follow(L, k){
  S.back.push({book:S.book, page:S.page, cursor:k, until:L.until || null, to:{book:L.go.book, page:L.go.page}});
  go(L.go.book, L.go.page, true);
  if(L.go.act){ const i = spreadSteps().findIndex(o => o.kind === 'act' && o.A.id === L.go.act); S.cursor = i - 1; }
  toast(`${bookName(L.go.book)} s.${L.go.page}`); updNav();
}
function returnDue(){
  const top = S.back[S.back.length - 1]; if(!top || !top.until) return false;
  const st = spreadSteps();
  if(top.until.act){ const i = st.findIndex(o => o.kind === 'act' && o.A.id === top.until.act); return i >= 0 && S.cursor >= i; }
  return S.book === top.to.book && viewPages().includes(top.until.page) && S.cursor >= st.length - 1;
}
function doReturn(shift = 0){
  const top = S.back.pop();

function updNav(){
  const list = pagesOf(S.book), vp = viewPages(), st = spreadSteps();
  const atStart = !S.zoom && S.cursor < 0 && !list.some(p => p < vp[0]) && !S.back.length;
  const atEnd = !S.zoom && S.cursor >= st.length - 1 && !list.some(p => p > vp[vp.length-1]) && !returnDue();

function onSpreadTap(ev, el, n){

  const hit = A => px >= A.rect[0] && px <= A.rect[0]+A.rect[2] && py >= A.rect[1] && py <= A.rect[1]+A.rect[3];
  const st = spreadSteps(), k = st.findIndex(o => o.kind === 'act' && o.n === n && hit(o.A));
  if(k >= 0){ S.cursor = k; openZoom(st[k]); return; }

  if(A && A.alias){ const M = S.books[S.book].pages[A.alias.page].activities.find(x => x.id === A.alias.act); openZoom({kind:'act', A:M, book:S.book, n:A.alias.page}); }

/* ---------- zoom: the activity grows out of the page ---------- */
function geom(){
  const railV = $('#rail').classList.contains('v');
  const L = 58, R = railV ? 74 + 58 : 58, T = 10, Bt = 60;
  return {x:L, y:T, w:innerWidth - L - R, h:innerHeight - T - Bt};
}
const tileOf = (t, n) => Array.isArray(t) ? {r:t, page:n} : {r:t.r, page:t.page || n};
function buildBoard(o){
  const {A, book, n} = o, B = S.books[book], board = $('#board'); board.innerHTML = '';
  const tiles = (A.tiles || [A.rect]).map(t => tileOf(t, n));
  const cols = A.tiles ? Math.min(A.cols || tiles.length, tiles.length) : 1, gap = 14;
  const numbered = A.tiles && tiles.length > 1 && A.nums !== false;
  const U = r => ({w: r[2] / 100 * B.aspect, h: r[3] / 100});
  const head = A.head ? tileOf(A.head, n) : null, hs = head ? U(head.r) : null, ts = tiles.map(t => U(t.r));
  const rows = []; for(let i = 0; i < ts.length; i += cols) rows.push(ts.slice(i, i + cols).map((t, j) => ({...t, i: i + j})));
  const G = geom();
  const rowW = row => row.reduce((s, t) => s + t.w, 0), rowH = row => Math.max(...row.map(t => t.h));
  const gapsH = r => (r.length - 1) * gap, nRows = rows.length + (head ? 1 : 0);
  const needW = ph => Math.max(head ? hs.w * ph : 0, ...rows.map(r => rowW(r) * ph + gapsH(r)));
  const needH = ph => (head ? hs.h * ph : 0) + rows.reduce((s, r) => s + rowH(r) * ph, 0) + (nRows - 1) * gap;
  let lo = 50, hi = 8000; for(let k = 0; k < 40; k++){ const m = (lo + hi) / 2; (needW(m) <= G.w && needH(m) <= G.h) ? lo = m : hi = m; }
  const ph = lo, pw = ph * B.aspect, W = needW(ph), H = needH(ph);
  const ox = G.x + (G.w - W) / 2, oy = G.y + (G.h - H) / 2;
  Object.assign(board.style,{left:ox+'px', top:oy+'px', width:W+'px', height:H+'px'});
  const place = (t, x, y, no) => {
    const r = t.r, el = document.createElement('div'); el.className = 'tile';
    const w = r[2] / 100 * pw, h = r[3] / 100 * ph;
    Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
    const pg = buildPage(book, t.page, true);
    Object.assign(pg.style,{width:pw+'px',height:ph+'px',left:(-r[0]/100*pw)+'px',top:(-r[1]/100*ph)+'px'});
    pg.style.setProperty('--ph', ph + 'px');
    if(no){ const c = document.createElement('div'); c.className = 'clip'; c.appendChild(pg); el.appendChild(c); el.classList.add('num');
      const b = document.createElement('div'); b.className = 'tno'; b.textContent = no; el.appendChild(b); }
    else el.appendChild(pg);
    board.appendChild(el); sizeInk(pg);
    return {w, h};
  };
  let y = 0;
  if(head){ place(head, (W - hs.w * ph) / 2, y); y += hs.h * ph + gap; }
  rows.forEach(r => {
    const w = rowW(r) * ph + gapsH(r); let x = (W - w) / 2;
    r.forEach(t => { const s = place(tiles[t.i], x, y, numbered ? t.i + 1 : 0); x += s.w + gap; });
    y += rowH(r) * ph + gap;
  });
  board.classList.add('zoom'); fit(board);
  return {ox, oy, W, H};
}
function srcRect(o){
  const pg = document.querySelector(`#spread .page[data-key="${o.book}:${o.n}"]`); if(!pg) return null;
  const r = pg.getBoundingClientRect(), [x,y,w,h] = o.A.rect;
  return {x: r.left + x/100*r.width, y: r.top + y/100*r.height, w: w/100*r.width, h: h/100*r.height};
}

/* ---------- spread layout ---------- */
function render(){
  const sp = $('#spread'); sp.innerHTML = '';
  const W = innerWidth, H = innerHeight, B = S.books[S.book];
  S.two = W / H >= 1.05;
  const pages = viewPages(), n = pages.length, m = 6, RAIL = 62, NAV = 54;
  const fitH = (aw, ah) => Math.min(ah, aw / (B.aspect * n));
  const optV = fitH(W - 2*NAV - RAIL - 2*m, H - 2*m), optH = fitH(W - 2*NAV - 2*m, H - 2*m - RAIL);
  const vert = optV >= optH, ph = vert ? optV : optH, pw = ph * B.aspect;
  $('#rail').className = vert ? 'v' : 'h';
  const totalW = pw * n;
  const left = vert ? NAV + m + (W - 2*NAV - RAIL - 2*m - totalW) / 2 : (W - totalW) / 2;
  const top = vert ? (H - ph) / 2 : m + (H - 2*m - RAIL - ph) / 2;
  Object.assign(sp.style,{left:left+'px', top:top+'px'});
  sp.className = n === 2 ? 'two' : '';
  pages.forEach((p, i) => {
    const el = buildPage(S.book, p, false);
    el.classList.add(n === 2 ? (i ? 'right' : 'left') : (p % 2 ? 'right' : 'left'));
    el.style.width = pw + 'px'; el.style.height = ph + 'px'; el.style.setProperty('--ph', ph + 'px');
    sp.appendChild(el); sizeInk(el);
  });
  fit(sp);
  $('#bbar').style.right = vert ? '16px' : (innerWidth - $('#rail').getBoundingClientRect().left + 10) + 'px';
  $('#bbar').style.justifyContent = vert ? 'center' : 'flex-start';
  $('#prev').style.left = '6px'; $('#next').style.right = vert ? (RAIL + 14) + 'px' : '6px';
  $('#bookBtn').textContent = S.book === 'dk' ? 'DK' : 'T';

function go(book, page, keepBack){

  if(audio.dataset.src){ audio.pause(); $('#audio').hidden = true; }

/* Opened in the telaffuz book without knowing where we came from (e.g. the lesson resumed here):

function restoreReturn(){
  if(S.back.length) return;

  for(const dk of pagesOf('dk').filter(() => S.book !== 'dk')){

      if(L.go.book !== S.book || !L.until) continue;
      const end = L.until.act ? actPage(L.go.book, L.until.act) : L.until.page;
      if(here.some(p => p >= L.go.page && p <= end)){
        const sp = spreadOf('dk', dk), k = spreadSteps('dk', sp).findIndex(o => o.kind === 'link' && o.L === L);
        S.back.push({book:'dk', page:dk, cursor:k, until:L.until, to:{book:L.go.book, page:L.go.page}});
        return;
      }
    }
  }
}

/* ---------- ink ---------- */
function setupInk(cv, key){
  let cur = null;
  const pt = ev => { const b = cv.getBoundingClientRect(); return [(ev.clientX-b.left)/b.width, (ev.clientY-b.top)/b.height]; };
  cv.addEventListener('pointerdown', ev => {
    if(!S.tool) return; ev.preventDefault(); ev.stopPropagation(); cv.setPointerCapture(ev.pointerId);
    cur = {t:S.tool, c:S.tool === 'hl' ? 'rgba(255,214,0,.5)' : S.color, p:[pt(ev)]};
    (S.ink[key] = S.ink[key] || []).push(cur); paintKey(key);
  });
  cv.addEventListener('pointermove', ev => { if(!cur) return; ev.preventDefault(); cur.p.push(pt(ev)); paintKey(key); });
  const end = () => cur = null; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('click', ev => { if(S.tool) ev.stopPropagation(); });
}
function sizeInk(pg){ const cv = pg.querySelector('canvas.ink'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(parseFloat(pg.style.width) * dpr)); cv.height = Math.max(1, Math.round(parseFloat(pg.style.height) * dpr)); paintCanvas(cv, pg.dataset.key); }
function paintKey(key){ document.querySelectorAll(`.page[data-key="${key}"] canvas.ink`).forEach(cv => paintCanvas(cv, key)); }
function redrawAllInk(){ document.querySelectorAll('.page').forEach(p => paintCanvas(p.querySelector('canvas.ink'), p.dataset.key)); }
function paintCanvas(cv, key){
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.clearRect(0,0,W,H); g.lineCap = 'round'; g.lineJoin = 'round';
  for(const s of (S.ink[key] || [])){
    g.strokeStyle = s.c; g.lineWidth = (s.t === 'hl' ? .022 : .0045) * H;
    g.globalCompositeOperation = s.t === 'hl' ? 'multiply' : 'source-over';
    g.beginPath(); s.p.forEach(([x,y], i) => i ? g.lineTo(x*W, y*H) : g.moveTo(x*W, y*H));
    if(s.p.length === 1) g.lineTo(s.p[0][0]*W + .5, s.p[0][1]*H);
    g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
}
const visibleKeys = () => S.zoom ? [...new Set([...document.querySelectorAll('#board .page')].map(p => p.dataset.key))] : viewPages().map(p => S.book + ':' + p);
function setTool(t){
  S.tool = S.tool === t ? null : t;
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === S.tool));
  document.body.classList.toggle('inking', !!S.tool);
  $('#pens').hidden = S.tool !== 'pen'; if(S.tool === 'pen') placePens();
}
function placePens(){
  const r = document.querySelector('.tool[data-tool="pen"]').getBoundingClientRect(), p = $('#pens');
  if($('#rail').classList.contains('v')) Object.assign(p.style,{left:'',bottom:'',right:(innerWidth - r.left + 8)+'px',top:r.top+'px'});
  else Object.assign(p.style,{right:'',top:'',left:r.left+'px',bottom:(innerHeight - r.top + 8)+'px'});
}

/* ---------- audio (in the rail) ---------- */
const audio = new Audio(); audio.preload = 'auto'; audio.dataset.src = '';
function openAudio(a){
  if(!a.src){ toast(`${a.code} sesi henüz eklenmedi`); return; }
  if(audio.dataset.src !== a.src){ audio.src = a.src; audio.dataset.src = a.src; }
  audio.currentTime = 0;
  audio.playbackRate = $('#pSlow').getAttribute('aria-pressed') === 'true' ? .8 : 1;
  $('#pCode').textContent = a.code; $('#audio').hidden = false;
  audio.play().catch(() => {});
}
const fmt = t => { t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
function syncPlayer(){
  $('#pPlay').innerHTML = audio.paused ? ICON.play : ICON.pause;
  $('#pTime').textContent = audio.duration ? fmt(audio.duration - audio.currentTime) : fmt(0);
  document.querySelectorAll('.aud').forEach(b => b.classList.toggle('playing', !audio.paused && !!b.dataset.src && b.dataset.src === audio.dataset.src));
}
['play','pause','timeupdate','loadedmetadata','ended'].forEach(e => audio.addEventListener(e, syncPlayer));
$('#pPlay').addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
$('#pAgain').addEventListener('click', () => { audio.currentTime = 0; audio.play(); });
$('#pSlow').addEventListener('click', e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on); audio.playbackRate = on ? .8 : 1; });
$('#pClose').addEventListener('click', () => { audio.pause(); $('#audio').hidden = true; syncPlayer(); });

/* ---------- timer ---------- */
const T = {total:120, left:120, run:false, h:null};
function tShow(){ $('#tBig').textContent = fmt(T.left); $('#timer').classList.toggle('low', T.run && T.left <= 10); $('#tGo').textContent = T.run ? 'Durdur' : (T.left === 0 ? 'Yeniden' : 'Başlat'); }
function tSet(s){ T.total = T.left = Math.max(10, s); T.run = false; clearInterval(T.h); $('#timer').classList.remove('done'); tShow(); }
function chime(){ try{ const C = new (window.AudioContext || window.webkitAudioContext)();
  [0,.25,.5].forEach((d,i) => { const o = C.createOscillator(), g = C.createGain(); o.frequency.value = [880,988,1175][i];
    g.gain.setValueAtTime(.0001, C.currentTime+d); g.gain.exponentialRampToValueAtTime(.3, C.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001, C.currentTime+d+.5);
    o.connect(g).connect(C.destination); o.start(C.currentTime+d); o.stop(C.currentTime+d+.55); }); }catch(e){} }
$('#timerBtn').addEventListener('click', () => { $('#timer').hidden = !$('#timer').hidden; tShow(); });
$('#tClose').addEventListener('click', () => { $('#timer').hidden = true; T.run = false; clearInterval(T.h); tShow(); });
$('#tPre').addEventListener('click', e => { const s = e.target.closest('button'); if(s) tSet(+s.dataset.s); });
$('#tMinus').addEventListener('click', () => { T.left = Math.max(10, T.left - 30); tShow(); });
$('#tPlus').addEventListener('click', () => { T.left += 30; tShow(); });
$('#tGo').addEventListener('click', () => {
  if(T.run){ T.run = false; clearInterval(T.h); return tShow(); }
  if(T.left === 0) T.left = T.total;
  $('#timer').classList.remove('done'); T.run = true;
  T.h = setInterval(() => { T.left--; if(T.left <= 0){ T.left = 0; T.run = false; clearInterval(T.h); $('#timer').classList.add('done'); chime(); } tShow(); }, 1000);
  tShow();
});

/* ---------- class picker ---------- */
function openPicker(){
  const g = $('#pickGrid'); g.innerHTML = '';
  CLASSES.forEach(c => { const p = pos[c], b = document.createElement('button');
    b.innerHTML = `<b>${c}</b><small>${p ? `${bookName(p.book)} s.${p.page}` : 'Yeni başlıyor'}</small>`;
    b.addEventListener('click', () => pickClass(c)); g.appendChild(b); });
  $('#picker').hidden = false;
}
function pickClass(c){
  S.cls = c; store.set('cls', c); $('#clsBtn').textContent = c; $('#picker').hidden = true;
  S.back = []; S.revealed.clear(); S.ink = {};
  const p = pos[c] || START;
  (S.books[p.book] && S.books[p.book].pages[p.page]) ? go(p.book, p.page) : go(START.book, START.page);
  showWhere();
}

/* ---------- wiring ---------- */
$('#prev').addEventListener('click', prev);
$('#next').addEventListener('click', next);
$('#zEye').addEventListener('click', () => S.zoom && toggleAll(S.zoom.A));
$('#zClose').addEventListener('click', closeZoom);
$('#zoom').addEventListener('click', e => { if(e.target.id === 'zoom' && !S.tool) closeZoom(); });
$('#back').addEventListener('click', () => { if(S.back.length) doReturn(); });
$('#bookBtn').addEventListener('click', () => {
  const b = S.book === 'dk' ? 'dbt' : 'dk', last = store.get('last-' + b, null);
  S.back.push({book:S.book, page:S.page, cursor:S.cursor, until:null, to:{book:b, page:0}});
  go(b, last && S.books[b].pages[last] ? last : pagesOf(b)[0], true); updNav();
});
document.querySelectorAll('.tool[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#pens').addEventListener('click', e => {
  const s = e.target.closest('.sw'); if(!s) return;
  S.color = s.dataset.c; $('#penDot').style.background = S.color;
  document.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === s));
});
$('#undo').addEventListener('click', () => { for(const k of visibleKeys().reverse()){ const a = S.ink[k]; if(a && a.length){ a.pop(); paintKey(k); break; } } });
$('#wipe').addEventListener('click', () => { visibleKeys().forEach(k => { S.ink[k] = []; paintKey(k); }); toast('Çizimler temizlendi'); });
$('#fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement, on = d.fullscreenElement || d.webkitFullscreenElement;
  try{ if(on) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const r = el.requestFullscreen || el.webkitRequestFullscreen; const p = r && r.call(el); if(!r) toast('Tam ekran bu cihazda açılamadı'); else if(p && p.catch) p.catch(() => toast('Tam ekran bu cihazda açılamadı')); } }
  catch(e){ toast('Tam ekran bu cihazda açılamadı'); }
});
$('#clsBtn').addEventListener('click', openPicker);
$('#whereBtn').addEventListener('click', showWhere);
$('#where').addEventListener('click', () => $('#where').hidden = true);
addEventListener('keydown', e => {
  if(!$('#picker').hidden) return;
  if(!$('#where').hidden){ if(['ArrowRight','PageDown',' ','Enter','Escape'].includes(e.key)){ e.preventDefault(); $('#where').hidden = true; } return; }
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key === 'Escape' && S.zoom) closeZoom();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const z = S.zoom; render(); if(z){ S.zoom = z; reZoom(); } if(S.tool === 'pen') placePens(); }, 120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(document));

Promise.all(['dk','dbt'].map(id => fetch('data/' + id + '.json').then(r => r.json()))).then(([dk, dbt]) => {
  S.books = {dk, dbt};
  const c = store.get('cls', null);
  if(c && CLASSES.includes(c)) pickClass(c); else { go(START.book, START.page); openPicker(); }
}).catch(() => { $('#loading').textContent = 'Kitap yüklenemedi. Sayfayı yenileyin.'; });
})();
</script>
